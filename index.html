<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitsanu Namnil - Portfolio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #020617; /* Slate 950 */
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-color: #10b981; /* Emerald 500 */
            --accent-gradient: linear-gradient(135deg, #10b981, #0ea5e9);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #020617;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: rgba(16, 185, 129, 0.3); /* Emerald */
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: rgba(14, 165, 233, 0.2); /* Sky */
            animation-delay: -5s;
        }
        
        .blob-3 {
            top: 40%;
            left: 30%;
            width: 40vw;
            height: 40vw;
            background: rgba(139, 92, 246, 0.15); /* Purple */
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, 5%) scale(0.9); }
        }

        /* Main Container */
        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255,255,255,0.1);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading State */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Markdown Styling */
        .markdown-body {
            color: var(--text-primary);
        }

        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3, 
        .markdown-body h4 {
            margin-top: 2em;
            margin-bottom: 0.75em;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .markdown-body h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 0.5em;
            text-align: center;
            letter-spacing: -0.04em;
        }

        .markdown-body h2 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5em;
            color: #fff;
        }

        .markdown-body h3 {
            font-size: 1.4rem;
            color: var(--accent-color);
        }

        .markdown-body p {
            margin-top: 0;
            margin-bottom: 1.5em;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .markdown-body ul {
            margin-top: 0;
            margin-bottom: 1.5em;
            padding-left: 1.5em;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .markdown-body li {
            margin-bottom: 0.5em;
            padding-left: 0.5em;
        }
        
        .markdown-body li::marker {
            color: var(--accent-color);
        }

        .markdown-body a {
            color: var(--accent-color);
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .markdown-body a:hover {
            color: #34d399;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .markdown-body a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: #34d399;
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }

        .markdown-body a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        .markdown-body strong {
            color: #fff;
            font-weight: 600;
        }

        .markdown-body hr {
            height: 1px;
            border: none;
            background: var(--glass-border);
            margin: 3em 0;
        }

        /* Enhance specific sections based on the README content */
        .markdown-body p:first-of-type {
            text-align: center;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            line-height: 2;
        }

        .markdown-body p:first-of-type strong {
            color: var(--accent-color);
            margin-right: 5px;
            margin-left: 15px;
        }
        
        .markdown-body p:first-of-type strong:first-child {
            margin-left: 0;
        }

        /* Hover effects on elements */
        .markdown-body h3 {
            transition: transform 0.3s ease;
            display: inline-block;
        }
        
        .markdown-body h3:hover {
            transform: translateX(5px);
        }

        .error-msg {
            text-align: center;
            color: #ef4444;
            padding: 30px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
                border-radius: 20px;
            }
            
            .markdown-body h1 {
                font-size: 2.5rem;
            }
            
            .markdown-body h2 {
                font-size: 1.6rem;
            }
            
            .markdown-body p:first-of-type {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            
            .markdown-body p:first-of-type strong {
                margin-left: 0;
            }
            
            .markdown-body p:first-of-type br {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Abstract Background -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <div id="content" class="markdown-body">
            <div class="loader">
                <div class="spinner"></div>
                <div style="color: var(--text-secondary); font-size: 0.9rem;">Loading Profile...</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('content');
            
            // Configure marked to handle breaks
            marked.setOptions({
                breaks: true,
                gfm: true
            });

            // Fetch and render the README.md file
            fetch('README.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load: ${response.status} ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(text => {
                    // Render markdown to HTML
                    const html = marked.parse(text);
                    contentDiv.innerHTML = html;
                    
                    // Add subtle animation to list items after rendering
                    const listItems = contentDiv.querySelectorAll('li');
                    listItems.forEach((li, index) => {
                        li.style.opacity = '0';
                        li.style.transform = 'translateY(10px)';
                        li.style.transition = `all 0.4s ease ${(index % 10) * 0.05 + 0.3}s`;
                        
                        setTimeout(() => {
                            li.style.opacity = '1';
                            li.style.transform = 'translateY(0)';
                        }, 50);
                    });
                })
                .catch(error => {
                    console.error('Error fetching README.md:', error);
                    contentDiv.innerHTML = `
                        <div class="error-msg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <h2>Unable to load README.md</h2>
                            <p>If you're viewing this locally (file://), your browser might be blocking the request due to CORS policies.</p>
                            <p>This page will work perfectly when deployed to GitHub Pages.</p>
                            <button onclick="window.location.href='README.md'" style="margin-top: 15px; padding: 10px 20px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600;">View Raw README.md</button>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
